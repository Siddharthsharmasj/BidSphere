name: BidSphere CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidsphere-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate and test Django
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bidsphere_test
          POSTGRES_USER: bidsphere
          POSTGRES_PASSWORD: bidsphere-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidsphere -d bidsphere_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret"
      DATABASE_URL: "postgresql://bidsphere:bidsphere-ci-only@127.0.0.1:5432/bidsphere_test"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Validate project structure and syntax
        run: python validate_project.py

      - name: Django configuration checks
        run: python manage.py check

      - name: Verify production settings without connecting to production
        env:
          DJANGO_SETTINGS_MODULE: bidsphere.settings
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-production-config-not-a-real-secret-8e5f3bc2-4fa1-4b62-9b1d-00be9f674c68"
          DATABASE_URL: "postgresql://bidsphere:bidsphere-ci-only@127.0.0.1:5432/bidsphere_test"
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.conf import settings
          assert settings.DEBUG is False
          assert settings.DATABASES["default"]["ENGINE"] == "django.db.backends.postgresql"
          assert settings.SECURE_SSL_REDIRECT is True
          assert settings.SECURE_HSTS_SECONDS >= 31536000
          assert settings.SESSION_COOKIE_SECURE is True
          assert settings.CSRF_COOKIE_SECURE is True
          assert ".vercel.app" in settings.ALLOWED_HOSTS
          print("Production settings smoke check passed (no live database connection attempted).")
          PY

      - name: Check Django deployment security settings
        env:
          DJANGO_SETTINGS_MODULE: bidsphere.settings
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-production-config-not-a-real-secret-8e5f3bc2-4fa1-4b62-9b1d-00be9f674c68"
          DATABASE_URL: "postgresql://bidsphere:bidsphere-ci-only@127.0.0.1:5432/bidsphere_test"
        run: python manage.py check --deploy

      - name: Verify static assets can be collected
        run: python manage.py collectstatic --noinput --clear

      - name: Ensure migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run automated tests (PostgreSQL)
        run: python manage.py test --verbosity 2

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  deploy-preview:
    name: Deploy Vercel Preview
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Put Vercel credentials in this protected environment, not repository secrets.
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project metadata
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing GitHub Actions secret: VERCEL_TOKEN" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing GitHub Actions secret: VERCEL_ORG_ID" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing GitHub Actions secret: VERCEL_PROJECT_ID" && exit 1)
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Preview environment settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Preview deployment
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Preview
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-production:
    name: Deploy Vercel Production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project metadata
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing GitHub Actions secret: VERCEL_TOKEN" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing GitHub Actions secret: VERCEL_ORG_ID" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing GitHub Actions secret: VERCEL_PROJECT_ID" && exit 1)
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Production environment settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Production deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
